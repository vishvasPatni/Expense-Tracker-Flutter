name: expense_tracker
description: Expense Tracker — Flutter + Supabase MVP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.4
  provider: ^6.1.2
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  csv: ^6.0.0
  share_plus: ^10.1.4
  connectivity_plus: ^6.1.1
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  shimmer: ^3.0.0
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/config/app.env
    - assets/logo.png
    - assets/logo_light.png
